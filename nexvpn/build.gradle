plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'ai.nextech.nexvpn'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        consumerProguardFiles "consumer-rules.pro"
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    // ics-openvpn core
    implementation 'de.blinkt.openvpn:ics-openvpn:0.7.47'

    // AndroidX
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.annotation:annotation:1.7.1'
}

// Maven publishing configuration
publishing {
    publications {
        release(MavenPublication) {
            groupId    = 'ai.nextech'
            artifactId = 'nexvpn'
            version    = '1.0.0'

            afterEvaluate {
                from components.release
            }

            pom {
                name        = 'NexVPN'
                description = 'A robust Android OpenVPN integration library'
                url         = 'https://github.com/nextech-ai/nexvpn'

                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url  = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }

                developers {
                    developer {
                        id   = 'nextech'
                        name = 'NexTech'
                    }
                }
            }
        }
    }
}
